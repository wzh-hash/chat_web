<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聊天 - chat_web</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/chat.css">
</head>
<body>
  <div id="app" class="chat-app">
    <header class="chat-header card">
      <a class="back-link" href="index.html">← 首页</a>
      <h1>终端对话</h1>
      <div class="header-controls">
        <label class="model-label">模型
          <select id="model-select" title="选择 Ollama 模型"></select>
        </label>
        <button id="settings-btn" title="设置">⚙ 设置</button>
        <button id="clear-btn" class="danger" title="清空对话">清空</button>
      </div>
    </header>

    <div id="error-banner" class="error-banner hidden">
      <span id="error-text"></span>
      <button id="retry-btn">重试</button>
    </div>

    <main id="messages" class="messages"></main>

    <footer class="chat-footer card">
      <details class="sys-prompt">
        <summary>系统提示词（可选）</summary>
        <textarea id="system-prompt" rows="2"
          placeholder="设定模型的行为、身份或约束……"></textarea>
      </details>
      <div class="input-row">
        <button id="siot-btn" class="siot-btn" title="采集 SIoT 实时数据">[SIoT]</button>
        <textarea id="prompt-input" rows="1"
          placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="send-btn" class="primary">发送</button>
        <button id="stop-btn" class="danger hidden">停止</button>
      </div>
    </footer>
  </div>

  <!-- SIoT 数据采集浮层 -->
  <div id="siot-popover" class="siot-popover hidden">
    <div class="siot-popover-inner">
      <label>Topic
        <input id="siot-topic" list="siot-topic-list" placeholder="例如 xzr/001">
        <datalist id="siot-topic-list"></datalist>
      </label>
      <label>采集时长
        <select id="siot-duration">
          <option value="3000">3 秒</option>
          <option value="5000" selected>5 秒</option>
          <option value="10000">10 秒</option>
        </select>
      </label>
      <button id="siot-start" class="primary">开始采集</button>
      <button id="siot-close" class="siot-close" title="关闭">✕</button>
    </div>
  </div>

  <dialog id="settings-dialog">
    <form id="settings-form">
      <h2>设置</h2>
      <fieldset>
        <legend>Ollama</legend>
        <label>地址
          <input name="ollamaUrl" type="url" placeholder="http://127.0.0.1:11434">
        </label>
        <label>连接方式
          <select name="ollamaMode">
            <option value="direct">直连</option>
            <option value="proxy">经本地服务器代理（/ollama）</option>
          </select>
        </label>
      </fieldset>
      <fieldset>
        <legend>SIoT（MQTT）</legend>
        <label>主机地址
          <input name="siotHost" placeholder="10.1.2.3">
        </label>
        <div class="form-row">
          <label>WebSocket 端口
            <input name="siotWsPort" type="number" min="1" max="65535" value="1888">
          </label>
          <label>路径
            <input name="siotWsPath" placeholder="如 /ws">
          </label>
        </div>
        <label class="checkbox-row">
          <input name="siotWsTls" type="checkbox">
          启用 TLS（wss://）
        </label>
        <div class="form-row">
          <label>账号
            <input name="siotUser" placeholder="siot">
          </label>
          <label>密码
            <input name="siotPwd" type="password" placeholder="dfrobot">
          </label>
        </div>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" id="settings-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="assets/chat.js"></script>
</body>
</html>
