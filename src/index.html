<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chat_web 首页</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/index.css">
</head>
<body>
  <main class="page">
    <div class="page-header">
      <h1>chat_web</h1>
      <button type="button" id="settings-btn" class="settings-btn" title="设置">⚙ 设置</button>
    </div>
    <p class="subtitle">本地工具集合（Ollama 聊天 + SIoT 数据可视化）</p>

    <section class="status-grid" id="status-grid">
      <div class="status-card">
        <span class="status-dot checking" id="ollama-dot"></span>
        <div class="status-info">
          <span class="status-label">Ollama</span>
          <span class="status-value" id="ollama-status">检测中…</span>
        </div>
      </div>
      <div class="status-card">
        <span class="status-dot checking" id="siot-dot"></span>
        <div class="status-info">
          <span class="status-label">SIoT</span>
          <span class="status-value" id="siot-status">检测中…</span>
        </div>
      </div>
    </section>

    <nav class="nav-cards">
      <a class="nav-card" href="chat.html">
        <div class="nav-icon nav-icon-terminal">
          <span class="term-prompt">&gt;</span>
          <span class="term-cursor">_</span>
        </div>
        <h2>终端对话</h2>
        <p>调用本地 Ollama 模型对话</p>
      </a>
      <a class="nav-card" href="dashboard.html">
        <div class="nav-icon nav-icon-chart">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <h2>数据监控</h2>
        <p>SIoT v2 多 topic 数据可视化</p>
      </a>
    </nav>
  </main>

  <dialog id="settings-dialog">
    <form id="settings-form">
      <h2>设置</h2>
      <fieldset class="titles-grid">
        <legend>界面标题</legend>
        <label>首页标题
          <input name="homeTitle" type="text" placeholder="chat_web">
        </label>
        <label class="titles-span2">首页副标题
          <input name="homeSubtitle" type="text" placeholder="本地工具集合…">
        </label>
        <label>导航卡片 — 聊天
          <input name="navChat" type="text" placeholder="终端对话">
        </label>
        <label>导航卡片 — 仪表盘
          <input name="navDash" type="text" placeholder="数据监控">
        </label>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" id="settings-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="assets/index.js"></script>
</body>
</html>
