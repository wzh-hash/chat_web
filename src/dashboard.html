<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据仪表盘 - chat_web</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/dashboard.css">
  <link rel="stylesheet" href="assets/chat.css">
</head>
<body>
  <div id="app" class="dash-app">
    <header class="dash-header card">
      <a class="back-link" href="index.html">← 首页</a>
      <h1><span id="dash-title-icon"></span><span id="dash-title-text">数据仪表盘</span></h1>
      <span id="conn-status" class="conn-status" data-state="stopped">未连接</span>
      <div class="header-controls">
        <button id="settings-btn" title="SIoT 连接设置">⚙ 设置</button>
        <button id="add-btn" class="primary">+ 添加图表</button>
      </div>
    </header>

    <main id="grid" class="grid"></main>

    <div id="empty-hint" class="empty-state card">
      <p>还没有图表</p>
      <p>点击右上角「+ 添加图表」，选择图表类型和 SIoT topic 开始可视化</p>
    </div>
  </div>

  <!-- 图表编辑对话框（添加/编辑共用） -->
  <dialog id="card-dialog">
    <form id="card-form">
      <h2 id="card-dialog-title">添加图表</h2>
      <label>标题
        <input name="title" placeholder="留空则用 topic">
      </label>
      <label>图表类型
        <div id="card-type-wrap"></div>
      </label>
      <label>SIoT topic（必填，订阅后实时推送）
        <input name="topic" placeholder="例如 xzr/001">
      </label>
      <label>JSON 字段（可选）
        <input name="jsonField" placeholder="消息为 JSON 时选取的字段，如 temp">
      </label>
      <label id="unit-row">单位（可选）
        <input name="unit" placeholder="如 °C、%">
      </label>
      <div class="form-row" id="threshold-row">
        <label>告警下限（可选）
          <input name="minValue" type="number" step="any" placeholder="如 0">
        </label>
        <label>告警上限（可选）
          <input name="maxValue" type="number" step="any" placeholder="如 100">
        </label>
      </div>
      <label id="actions-row">控制指令
        <div id="actions-editor"></div>
        <button type="button" id="actions-add" class="actions-add">+ 添加指令</button>
      </label>
      <label>显示条数（缓冲上限，最多 200）
        <input name="psize" type="number" min="1" max="200" value="50">
      </label>
      <p id="card-error" class="form-error hidden"></p>
      <div class="dialog-actions">
        <button type="button" id="card-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- SIoT 连接设置对话框（MQTT over WebSocket） -->
  <dialog id="settings-dialog">
    <form id="settings-form">
      <h2>SIoT 连接设置（MQTT）</h2>
      <fieldset>
        <legend>界面标题</legend>
        <label>仪表盘标题
          <input name="dashboardTitle" type="text" placeholder="数据仪表盘">
        </label>
      </fieldset>
      <label>主机地址
        <input name="siotHost" placeholder="10.1.2.3（行空板默认）">
      </label>
      <div class="form-row">
        <label>WebSocket 端口
          <input name="siotWsPort" type="number" min="1" max="65535" value="1888">
        </label>
        <label>路径（可选）
          <input name="siotWsPath" placeholder="如 /mqtt，留空则根路径">
        </label>
      </div>
      <label class="checkbox-row">
        <input name="siotWsTls" type="checkbox">
        启用 TLS（wss://）
      </label>
      <div class="form-row">
        <label>账号
          <input name="siotUser" placeholder="siot">
        </label>
        <label>密码
          <input name="siotPwd" type="password" placeholder="dfrobot">
        </label>
      </div>
      <p class="form-hint">提示：连接参数可用 `node scripts/probe-mqtt.mjs &lt;主机IP&gt; &lt;topic&gt;` 探测</p>
      <div class="dialog-actions">
        <button type="button" id="settings-cancel">取消</button>
        <button type="submit" class="primary">保存并连接</button>
      </div>
    </form>
  </dialog>

  <!-- 悬浮球聊天 -->
  <button id="chat-ball" class="chat-ball" title="打开聊天"></button>
  <div id="chat-window" class="chat-window hidden">
    <div class="chat-window-header" id="chat-window-header">
      <span class="chat-window-title">终端对话</span>
      <button type="button" id="chat-window-minimize" class="chat-window-minimize" title="最小化">—</button>
    </div>
    <div class="chat-window-body" id="chat-widget-mount"></div>
  </div>

  <script src="assets/dashboard.js"></script>
</body>
</html>
