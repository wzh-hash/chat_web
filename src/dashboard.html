<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据仪表盘 - chat_web</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
  <div id="app" class="dash-app">
    <header class="dash-header card">
      <a class="back-link" href="index.html">← 首页</a>
      <h1>数据仪表盘</h1>
      <div class="header-controls">
        <button id="settings-btn" title="SIoT 设置">⚙ 设置</button>
        <button id="add-btn" class="primary">+ 添加图表</button>
      </div>
    </header>

    <main id="grid" class="grid"></main>

    <div id="empty-hint" class="empty-state card">
      <p>还没有图表</p>
      <p>点击右上角「+ 添加图表」，选择图表类型和 SIoT topic 开始可视化</p>
    </div>
  </div>

  <!-- 图表编辑对话框（添加/编辑共用） -->
  <dialog id="card-dialog">
    <form id="card-form">
      <h2 id="card-dialog-title">添加图表</h2>
      <label>标题
        <input name="title" placeholder="留空则用 topic">
      </label>
      <label>图表类型
        <select id="card-type">
          <option value="line">折线图</option>
          <option value="area">面积图</option>
          <option value="bar">柱状图</option>
          <option value="pie">饼图（按值分类统计）</option>
          <option value="gauge">仪表盘（最新值）</option>
          <option value="scatter">散点图</option>
        </select>
      </label>
      <label>SIoT topic（必填）
        <input name="topic" placeholder="例如 xzr/001">
      </label>
      <label>JSON 字段（可选）
        <input name="jsonField" placeholder="Content 为 JSON 时选取的字段，如 temp">
      </label>
      <div class="form-row">
        <label>最近条数
          <input name="psize" type="number" min="1" max="200" value="50">
        </label>
        <label>刷新间隔（毫秒，0=不刷新）
          <input name="refreshMs" type="number" min="0" value="5000">
        </label>
      </div>
      <p id="card-error" class="form-error hidden"></p>
      <div class="dialog-actions">
        <button type="button" id="card-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- SIoT 设置对话框 -->
  <dialog id="settings-dialog">
    <form id="settings-form">
      <h2>SIoT 设置</h2>
      <label>地址
        <input name="siotUrl" type="url" placeholder="http://127.0.0.1:8080">
      </label>
      <label>账号
        <input name="siotUser" placeholder="siot">
      </label>
      <label>密码
        <input name="siotPwd" type="password" placeholder="dfrobot">
      </label>
      <label>连接方式
        <select name="siotMode">
          <option value="direct">直连</option>
          <option value="proxy">经本地服务器代理（/siot）</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="button" id="settings-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="assets/dashboard.js"></script>
</body>
</html>
